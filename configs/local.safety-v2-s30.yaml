schema_version: 1

# Safety-v2：正式模型仍使用五档归一化压力，但限制 GPU Compute 实际作用量。
host:
  id: "windows-rtx4060"
  platform: "windows"
  gpu_index: 0
  display_index: 0
  dpi_awareness: "per_monitor_v2"
  window_layout: "grid_2x2"
  require_visible_windows: true
  cpu_affinity: null
  cooldown_s: 10
  max_gpu_temp_c: 80

measurement:
  warmup_s: 10
  duration_s: 30
  sample_interval_s: 1.0
  repeats: 3
  qos_ratios: [0.70, 0.80, 0.90]
  random_seed: 20260811
  pressure_caps:
    cpu_compute: 1.0
    memory_bandwidth: 1.0
    gpu_compute: 0.25
    gpu_memory: 1.0

paths:
  raw: "data/raw/safety-v2-s30"
  interim: "data/interim"
  processed: "data/processed"
  artifacts: "artifacts"
